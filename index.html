    <!-- HREFLANG_PLACEHOLDER -->

    <!-- CMP INTEGRATION POINT: a Google-certified Consent Management Platform must be
         added here, as the FIRST script element in the document head, before the
         Google Consent Mode stub below and before any AdSense or gtag script anywhere
         on the page. (See support.google.com/adsense/answer/13554116 for Google's
         certified CMP list.) Google's own guidance requires the CMP to load and have
         a chance to signal consent before any Google tag reads it. Not installed yet:
         this site does not have Google AdSense account access yet, and no CMP should
         be added speculatively. Once an AdSense account exists, replace this comment
         with the CMP vendor's provided script, inserted at exactly this position. -->

    <!-- Google Consent Mode defaults (analytics/ads storage denied) -- set before ANY Google
         script exists on the page. Google Analytics itself is NOT loaded here: the gtag.js
         script is only fetched dynamically, and only after the visitor explicitly accepts
         analytics cookies (see src/lib/analytics.ts). This stub just makes early gtag()
         calls safe to queue instead of throwing, and records the consent default so any
         script that DOES load later already knows the visitor's standing choice. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      var pfConsentGranted = false;
      try {
        var pfStored = JSON.parse(localStorage.getItem('pf_cookie_consent'));
        pfConsentGranted = !!(pfStored && pfStored.analytics === true);
      } catch (e) {}
      gtag('consent', 'default', {
        ad_storage: pfConsentGranted ? 'granted' : 'denied',
        ad_user_data: pfConsentGranted ? 'granted' : 'denied',
        ad_personalization: pfConsentGranted ? 'granted' : 'denied',
        analytics_storage: pfConsentGranted ? 'granted' : 'denied',
        wait_for_update: 500
      });
    </script>
    <!-- Preconnect to high-priority CDNs -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- Self-hosted fonts (see src/index.css for @font-face rules), all three
         preloaded -- Fira Code (font-mono) is used above the fold by every section's
         kicker/badge label, including the Hero's, so leaving it undiscovered until
         the CSS parses was adding a full extra network round-trip to the critical
         path. font-display: swap means text still paints immediately with the
         fallback stack regardless, but preloading avoids the later, disruptive swap. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plus-jakarta-sans-variable.woff2" crossorigin />
